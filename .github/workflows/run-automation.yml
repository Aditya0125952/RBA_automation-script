name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      applicantOverrides:
        description: "FE applicant override JSON"
        required: false
        type: string

      lenderSelection:
        description: "FE lender selection JSON"
        required: false
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: PlayWright
        run: npm ci

      # 🔥 THIS IS THE CRITICAL FIX
      - name: Inject FE overrides into environment
        run: |
          echo "FE_DATA={\"applicantOverrides\":${{ github.event.inputs.applicantOverrides || '{}' }},\"lenderSelection\":${{ github.event.inputs.lenderSelection || '{}' }}}" >> $GITHUB_ENV

      - name: Install Playwright browsers
        working-directory: PlayWright
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: PlayWright
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: PlayWright/playwright-report
          retention-days: 30
